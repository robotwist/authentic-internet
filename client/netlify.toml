[build]
  command = "npm run build"
  publish = "dist"
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- ./client/"

# Proxy API requests to the backend on Render
[[redirects]]
  from = "/api/*"
  to = "https://authentic-internet.onrender.com/api/:splat"
  status = 200
  force = true

  [redirects.headers]
    X-From = "flourishing-starburst-8cf88b.netlify.app"
    Access-Control-Allow-Origin = "*"
    Access-Control-Allow-Methods = "GET, POST, PUT, DELETE, OPTIONS"
    Access-Control-Allow-Headers = "Origin, X-Requested-With, Content-Type, Accept, Authorization"

# Handle SPA routing
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Environment variables
[context.production.environment]
  VITE_API_URL = "https://authentic-internet.onrender.com"
  NODE_VERSION = "20"

[context.deploy-preview.environment]
  VITE_API_URL = "https://authentic-internet.onrender.com"
  NODE_VERSION = "20"

# Add build plugins for better performance
[[plugins]]
  package = "@netlify/plugin-lighthouse"

# Add specific headers for all pages
[[headers]]
  for = "/*"
    [headers.values]
    Cache-Control = "public, max-age=3600"
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block" 